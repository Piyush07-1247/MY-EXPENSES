<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyush's Tracker (Karma Yogi)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #fff;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(to right, rgba(255, 99, 71, 0.8), rgba(65, 105, 225, 0.8));
            font-size: 2.8em;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .container {
            max-width: 1300px;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            flex-grow: 1;
        }

        .banner {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .banner:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 99, 71, 0.5), rgba(65, 105, 225, 0.5));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .banner:hover::before {
            opacity: 1;
        }

        .banner-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            text-align: center;
        }

        .banner h2 {
            font-size: 2em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            transition: transform 0.4s ease;
        }

        .banner:hover h2 {
            transform: scale(1.1);
        }

        .toggle-btn {
            background: linear-gradient(45deg, #ff6347, #4169e1);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: linear-gradient(to right, rgba(255, 99, 71, 0.8), rgba(65, 105, 225, 0.8));
            font-size: 1.2em;
            font-weight: 500;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            position: sticky;
            bottom: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .banner {
            animation: pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <header>Piyush's Tracker (Karma Yogi)</header>
    <div class="container">
        <!-- Banner 1: Monthly Budget -->
        <div class="banner" style="background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40');">
            <div class="banner-content">
                <h2>Monthly Budget</h2>
                <button class="toggle-btn" data-form="https://docs.google.com/forms/d/e/1FAIpQLSehx31bD8cE_EqqAsOR0xKr0bmtTs8MsFeYQbmHtjfEmSqR9A/viewform?embedded=true">Open Form</button>
            </div>
        </div>

        <!-- Banner 2 -->

            <div class="banner-content">
                <h2>Your Heading Here</h2>
                <button class="toggle-btn" data-form="">Open Form</button>

        <!-- Banner 4 -->

            <div class="banner-content">
                <h2>Your Heading Here</h2>
                <button class="toggle-btn" data-form="">Open Form</button>
            </div>
        </div>

        <!-- Banner 5 -->
        <div class="banner" style="background-image: url('https://images.unsplash.com/photo-1484100356142-db8c74d24a30');">
            <div class="banner-content">

            </div>
        </div>

        <!-- Banner 6 -->
        <div class="banner" style="background-image: url('https://images.unsplash.com/photo-1517816743773-39e7f4864c66');">

        <div class="banner" style="background-image: url('https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b');">

                <button class="toggle-btn" data-form="">Open Form</button>
            </div>
        </div>
    </div>
    <footer>Made by Piyush Gangwar</footer>

    <script>
        document.querySelectorAll('.toggle-btn').forEach(button => {
            button.addEventListener('click', () => {
                const formUrl = button.getAttribute('data-form');
                if (formUrl) {
                    window.open(formUrl, '_blank', 'fullscreen=yes');
                } else {
                    alert('Please add a form URL to this banner!');
                }
            });
        });
    </script>
</body>
</html>
